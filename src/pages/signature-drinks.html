    // buildVideo plays once (ingredients drop into the spinning glass), then

    // =====================================================================
    let sdSeqGen = 0;            // generation token: bumps on every media change
    let sdSeqCleanup = null;     // tears down listeners/timers of the previous generation
    const sdSeqState = { active: false, framing: null };
    let sdOverrideDefaultKey = null;

    function sdFirstStr(...vals) {
      for (let i = 0; i < vals.length; i++) {
        if (typeof vals[i] === 'string' && vals[i].trim()) return vals[i].trim();
      }
      return '';
    }

    function sdIsSequenceConfig(cfg) {
      if (!cfg) return false;
      const b = sdFirstStr(cfg.buildVideo, cfg.buildVideoUrl, cfg.abVideo, cfg.abVideoUrl, cfg.partAVideo, cfg.pouringVideo, cfg.introVideo, cfg.build_video);
      const l = sdFirstStr(cfg.loopVideo, cfg.loopVideoUrl, cfg.bbVideo, cfg.bbVideoUrl, cfg.partBVideo, cfg.spinVideo, cfg.loop_video);
      const resolvedL = (!l && b) ? sdFirstStr(cfg.video, cfg.videoUrl) : l;
      return Boolean(b && resolvedL && resolvedL !== b);
    }

    function sdNormalizeFraming(fr) {
      if (!fr || typeof fr !== 'object') return null;
      const n = (v) => (typeof v === 'number' && isFinite(v)) ? v : parseFloat(v);
      const safeW = n(fr.safeW), safeH = n(fr.safeH), cx = n(fr.cx), cy = n(fr.cy);
      if (![safeW, safeH, cx, cy].every(v => isFinite(v) && v >= 0 && v <= 1)) return null;
      if (safeW <= 0 || safeH <= 0) return null;
      const aspect = typeof fr.aspect === 'string' ? fr.aspect.trim() : '';
      return aspect ? { safeW, safeH, cx, cy, aspect } : { safeW, safeH, cx, cy };
    }

    function sdExtractMedia(obj, fallbackObj) {
      const o = obj && typeof obj === 'object' ? obj : {};
      const fb = fallbackObj && typeof fallbackObj === 'object' ? fallbackObj : {};
      const buildVideo = sdFirstStr(
        o.buildVideo, o.buildVideoUrl, o.abVideo, o.abVideoUrl, o.partAVideo, o.pouringVideo, o.introVideo, o.build_video,
        fb.buildVideo, fb.buildVideoUrl, fb.abVideo, fb.abVideoUrl, fb.partAVideo, fb.pouringVideo, fb.introVideo, fb.build_video

        o.loopVideo, o.loopVideoUrl, o.bbVideo, o.bbVideoUrl, o.partBVideo, o.spinVideo, o.loop_video,
        fb.loopVideo, fb.loopVideoUrl, fb.bbVideo, fb.bbVideoUrl, fb.partBVideo, fb.spinVideo, fb.loop_video
      );
      const video = sdFirstStr(o.video, o.videoUrl, loopVideo, fb.video, fb.videoUrl);
      const img = sdFirstStr(o.img, o.imageUrl, o.image, fb.img, fb.imageUrl, fb.image);
      const framing = sdNormalizeFraming(o.framing) || sdNormalizeFraming(fb.framing) || null;
      return {
        img,
        video,
        buildVideo,
        loopVideo,
        framing,
        ambient: sdFirstStr(o.ambient, fb.ambient) || '#0d1712'
      };
    }

    function sdNormalizeVariant(v, parent) {
      if (!v || typeof v !== 'object') return null;
      const p = parent && typeof parent === 'object' ? parent : {};
      const m = sdExtractMedia(v, p);
      return Object.assign({}, v, {
        title: sdFirstStr(v.title, p.title),

    function sdParseHex(hex) {
      if (typeof hex !== 'string') return null;
      const m = hex.trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return null;
      let h = m[1];
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16)
      };
    }

    function sdMixDark(hex, keepRatio) {
      const rgb = sdParseHex(hex);
      if (!rgb) return '#0d1712';
      const w = Math.max(0, Math.min(1, typeof keepRatio === 'number' ? keepRatio : 0.5));
      const base = { r: 11, g: 13, b: 12 };
      const ch = (a, b) => Math.max(0, Math.min(255, Math.round(a * w + b * (1 - w)))).toString(16).padStart(2, '0');
      return '#' + ch(rgb.r, base.r) + ch(rgb.g, base.g) + ch(rgb.b, base.b);
    }

    async function sdSamplePosterBackdrop(imgUrl) {
      if (!imgUrl) return null;
      const abs = sdAbsUrl(imgUrl);
      if (sdBackdropCache[abs]) return sdBackdropCache[abs];
      try {
        const res = await fetch(abs, { mode: 'cors' });
        if (!res.ok) return null;
        const blob = await res.blob();
        let bmp = null;
        try {
          bmp = await createImageBitmap(blob, { resizeWidth: 16, resizeHeight: 16 });
        } catch (e) {
          bmp = await createImageBitmap(blob);
        }
        const c = document.createElement('canvas');
        c.width = 16;
        c.height = 16;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        if (!ctx) {
          if (bmp && bmp.close) bmp.close();
          return null;
        }
        ctx.drawImage(bmp, 0, 0, 16, 16);
        if (bmp && bmp.close) bmp.close();
        const pts = [[1, 1], [14, 1], [1, 14], [14, 14]];
        let r = 0, g = 0, b = 0;
        pts.forEach(([x, y]) => {
          const px = ctx.getImageData(x, y, 1, 1).data;
          r += px[0];
          g += px[1];
          b += px[2];
        });
        const ch = (v) => Math.max(0, Math.min(255, Math.round(v / pts.length))).toString(16).padStart(2, '0');
        const sampledHex = '#' + ch(r) + ch(g) + ch(b);
        sdBackdropCache[abs] = sampledHex;
        return sampledHex;
      } catch (e) {
        return null;
      }
    }

    function setStageBg(bgHex) {
      const hex = sdFirstStr(bgHex) || '#0d1712';
      const showcase = document.querySelector('.signature-drinks-showcase');
      if (showcase) {
        showcase.style.setProperty('--sd-stage-bg', hex);
        showcase.style.backgroundColor = hex;
      }
      const body = document.getElementById('body-bg') || document.body || document.documentElement;
      if (body) body.style.backgroundColor = hex;
    }

    function applyAmbientColor(color, config) {
      const c = sdFirstStr(color) || '#0d1712';
      const resolved = config ? sdResolveConfig(config) : null;
      if (resolved && sdIsSequenceConfig(resolved)) {
        const posterAbs = resolved.img ? sdAbsUrl(resolved.img) : '';
        if (posterAbs && sdBackdropCache[posterAbs]) {
          setStageBg(sdBackdropCache[posterAbs]);
          return;
        }
        setStageBg(sdMixDark(c, 0.45));
        if (resolved.img) {
          const targetKey = currentDrinkKey;
          sdSamplePosterBackdrop(resolved.img).then((sampledHex) => {
            if (sampledHex && currentDrinkKey === targetKey) {
              setStageBg(sampledHex);
            }
          });
        }
        return;
      }
      setStageBg(sdMixDark(c, 0.65));
    }

    function applyOrderLink(drink) {
      const btn = document.getElementById('drink-order-btn');
      if (!btn) return;
      const url = sdFirstStr(drink && drink.orderUrl, crmOrderNowUrl, 'https://pony-white-cafe.square.site/s/order');
      btn.setAttribute('href', url);
    }

    function expandCategoryForDrink(key) {
      const targetBtn = Array.from(document.querySelectorAll('.drink-nav-item')).find(
        btn => btn.getAttribute('data-drink-key') === key
      );
      if (!targetBtn) return null;
      const targetGroup = targetBtn.closest('.category-group');
      document.querySelectorAll('.category-group').forEach(group => {
        const content = group.querySelector('.category-content');
        if (group === targetGroup) {
          group.classList.add('category-open');
          if (content) content.style.maxHeight = content.scrollHeight + 'px';
        } else if (group.classList.contains('category-open')) {
          group.classList.remove('category-open');
          if (content) content.style.maxHeight = '0px';
        }
      });
      return targetBtn;
    }

    // Debug-only QA override (inert unless explicitly requested):
    //   ?sdSeqTest=<buildUrl>|<loopUrl>[&sdSeqFraming=safeW,safeH,cx,cy][&sdSeqDrink=<drinkKey>]
    //   or window.PW_SEQUENCE_OVERRIDE = { buildVideo, loopVideo, framing?, drinkKey? }
    // Applies to a single drink only (sdSeqDrink / drinkKey, else the first drink shown).
    function sdGetSequenceOverride() {
      try {
        let o = null;
        if (window.PW_SEQUENCE_OVERRIDE && typeof window.PW_SEQUENCE_OVERRIDE === 'object') {
          o = Object.assign({}, window.PW_SEQUENCE_OVERRIDE);
        }
        const qs = new URLSearchParams(window.location.search || '');
        const raw = qs.get('sdSeqTest');
        if (raw && raw.indexOf('|') > 0) {
          const parts = raw.split('|');
          o = { buildVideo: parts[0], loopVideo: parts[1] };
          const fr = qs.get('sdSeqFraming');
          if (fr) {
            const f = fr.split(',').map(parseFloat);
            o.framing = { safeW: f[0], safeH: f[1], cx: f[2], cy: f[3] };
          }
          if (qs.get('sdSeqDrink')) o.drinkKey = qs.get('sdSeqDrink');
        }
        if (!o || !sdIsSequenceConfig(o)) return null;
        return o;
      } catch (e) {
        return null;
      }
    }

    function sdApplyOverride(config) {
      const o = sdGetSequenceOverride();
      if (!o) return config;
      if (!sdOverrideDefaultKey) sdOverrideDefaultKey = o.drinkKey || currentDrinkKey;
      if (currentDrinkKey !== (o.drinkKey || sdOverrideDefaultKey)) return config;
      return Object.assign({}, config, {
        buildVideo: o.buildVideo,
        loopVideo: o.loopVideo,
        video: o.loopVideo,
        framing: o.framing !== undefined ? sdNormalizeFraming(o.framing) : config.framing
      });
    }

    function sdResolveConfig(config) {
      return config ? sdApplyOverride(config) : config;
    }

    function sdAbsUrl(u) {
      try { return new URL(u, window.location.href).href; } catch (e) { return u; }
    }

    // ---------- Smart framing: keep the whole drink visible ----------
    function sdClearFraming(v) {
      if (!v) return;
      v.classList.remove('sd-framed', 'sd-feather', 'sd-reframe-anim');
      ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(p => { v.style[p] = ''; });
      ['--sd-fx0', '--sd-fx1', '--sd-fy0', '--sd-fy1'].forEach(p => { v.style.removeProperty(p); });
    }

    function sdFallbackDimsFromAspect(fr) {
      const aspect = fr && typeof fr.aspect === 'string' ? fr.aspect.trim() : '';
      if (aspect === '9:16') return { vw: 1080, vh: 1920 };
      if (aspect === '1:1') return { vw: 1080, vh: 1080 };
      if (aspect === '4:5') return { vw: 1080, vh: 1350 };
      if (aspect === '4:3') return { vw: 1440, vh: 1080 };
      return { vw: 1280, vh: 720 };
    }

    function sdHideFallbackImg(img) {
      if (!img) return;
      img.classList.add('sd-instant');
      img.style.opacity = '0';
      img.style.display = 'none';
      img.classList.add('hidden');
      img.removeAttribute('src');
      void img.offsetWidth;
      img.classList.remove('sd-instant');
    }

    function sdIsDescriptionVisible(desc) {
      if (!desc) return false;
      if (desc.style.display === 'none' || desc.classList.contains('panel-hidden')) return false;
      return desc.offsetWidth > 0 && desc.offsetHeight > 0;
    }

    function sdLayoutVideos() {
      const img = document.getElementById('drink-image');
      const build = document.getElementById('drink-video');
      const loop = document.getElementById('drink-video-loop');
      const showcase = document.querySelector('.signature-drinks-showcase');
      if (!build || !loop || !showcase) return;
      const fr = sdSeqState.framing;
      if (!sdSeqState.active || !fr) {
        sdClearFraming(build);
        sdClearFraming(loop);
        sdClearFraming(img);
        return;
      }

      const isDesktop = window.innerWidth >= 1024;
      const stage = !isDesktop ? (document.getElementById('drink-media-stage') || showcase) : showcase;
      const cr = stage.getBoundingClientRect();
      const W = cr.width, H = cr.height;
      if (W < 2 || H < 2) return;
      const fallbackDims = sdFallbackDimsFromAspect(fr);
      const hasLoopDims = loop.readyState >= 1 && loop.videoWidth > 0 && loop.videoHeight > 0;
      const hasBuildDims = build.readyState >= 1 && build.videoWidth > 0 && build.videoHeight > 0;
      const vw = hasLoopDims ? loop.videoWidth : (hasBuildDims ? build.videoWidth : fallbackDims.vw);
      const vh = hasLoopDims ? loop.videoHeight : (hasBuildDims ? build.videoHeight : fallbackDims.vh);

      // Available rect (stage coordinates) = container minus occluders.
      let ax0 = 0, ax1 = W, ay0 = 0, ay1 = H;
      if (isDesktop) {
        const desc = document.getElementById('drink-description');
        const mainEl = desc ? desc.offsetParent : null;
        const descVisible = sdIsDescriptionVisible(desc);
        let descLeft = null;
        if (descVisible && mainEl) {
          const mr = mainEl.getBoundingClientRect();
          descLeft = mr.left - cr.left + desc.offsetLeft;
        }
        const aside = document.querySelector('aside.sidebar-slide');
        const asideRight = aside ? (aside.getBoundingClientRect().right - cr.left) : null;
        const minW = 0.35 * W;
        if (asideRight !== null && descLeft !== null && (descLeft - asideRight) >= minW) {
          ax0 = asideRight; ax1 = descLeft;
        } else if (descLeft !== null && descLeft >= minW) {
          ax1 = descLeft;
        } else if (asideRight !== null && (W - asideRight) >= minW) {
          ax0 = asideRight;
        }
      } else {
        // Mobile 2-zone top visual stage: keep drink below top menu pill & above bottom floor seam
        ay0 = 60;
        ay1 = Math.max(200, H - 12);
      }

      const availW = Math.max(1, ax1 - ax0), availH = Math.max(1, ay1 - ay0);
      const acx = (ax0 + ax1) / 2, acy = (ay0 + ay1) / 2;
      const sCover = Math.max(W / vw, H / vh);
      const sFit = Math.min(availW / (fr.safeW * vw), availH / (fr.safeH * vh)) * 0.94;
      const eps = 0.5;

      let dw, dh, left, top, coverOk = false;
      if (isDesktop) {
        const maxSafeHFrac = 0.58;
        const sComfort = (availH * maxSafeHFrac) / (fr.safeH * vh);
        const s = Math.min(sCover, sFit, sComfort);
        dw = vw * s;
        dh = vh * s;
        left = acx - fr.cx * dw;
        top = acy - fr.cy * dh;
        if (dw >= W - eps) left = Math.min(0, Math.max(W - dw, left));
        if (dh >= H - eps) top = Math.min(0, Math.max(H - dh, top));
      } else {
        dw = vw * sCover;
        dh = vh * sCover;
        left = Math.min(0, Math.max(W - dw, acx - fr.cx * dw));
        top = Math.min(0, Math.max(H - dh, acy - fr.cy * dh));
        const sx0 = left + (fr.cx - fr.safeW / 2) * dw, sx1 = left + (fr.cx + fr.safeW / 2) * dw;
        const sy0 = top + (fr.cy - fr.safeH / 2) * dh, sy1 = top + (fr.cy + fr.safeH / 2) * dh;
        coverOk = sx0 >= ax0 - eps && sx1 <= ax1 + eps && sy0 >= ay0 - eps && sy1 <= ay1 + eps;
        if (!coverOk) {
          const s = Math.min(sCover, sFit);
          dw = vw * s;
          dh = vh * s;
          left = acx - fr.cx * dw;
          top = acy - fr.cy * dh;
          if (dw >= W - eps) left = Math.min(0, Math.max(W - dw, left));
          if (dh >= H - eps) top = Math.min(0, Math.max(H - dh, top));
        }
      }

      const fadeL = left > eps;
      const fadeR = (left + dw) < W - eps;
      const fadeT = top > eps;
      const fadeB = (top + dh) < H - eps;
      const feather = fadeL || fadeR || fadeT || fadeB;
      const fx0 = fadeL ? '8%' : '0%';
      const fx1 = fadeR ? '92%' : '100%';
      const fy0 = fadeT ? '8%' : '0%';
      const fy1 = fadeB ? '94%' : '100%';

      const framedTargets = [build, loop];
      if (img && img.style.display !== 'none') framedTargets.push(img);
      framedTargets.forEach(v => {
        v.classList.add('sd-framed');
        v.classList.toggle('sd-feather', feather);
        v.style.left = left.toFixed(2) + 'px';
        v.style.top = top.toFixed(2) + 'px';
        v.style.width = dw.toFixed(2) + 'px';
        v.style.height = dh.toFixed(2) + 'px';
        v.style.right = 'auto';
        v.style.bottom = 'auto';
        v.style.setProperty('--sd-fx0', fx0);
        v.style.setProperty('--sd-fx1', fx1);
        v.style.setProperty('--sd-fy0', fy0);
        v.style.setProperty('--sd-fy1', fy1);
      });
      showcase.setAttribute('data-sd-framing', coverOk ? 'cover' : (feather ? 'fit-feather' : 'fit'));
    }

    let sdLayoutRaf = 0;
    function sdScheduleLayout() {
      if (sdLayoutRaf) cancelAnimationFrame(sdLayoutRaf);
      sdLayoutRaf = requestAnimationFrame(() => {
        sdLayoutRaf = 0;
        sdLayoutVideos();
      });
    }

    let sdReframeAnimTimer = 0;
    function sdTriggerPanelReframeAnim() {
      const targets = [
        document.getElementById('drink-video'),
        document.getElementById('drink-video-loop'),
        document.getElementById('drink-image')
      ];
      targets.forEach(el => {
        if (el) el.classList.add('sd-reframe-anim');
      });
      if (sdReframeAnimTimer) {
        clearTimeout(sdReframeAnimTimer);
        sdReframeAnimTimer = 0;
      }
      sdScheduleLayout();
      sdReframeAnimTimer = setTimeout(() => {
        sdReframeAnimTimer = 0;
        targets.forEach(el => {
          if (el) el.classList.remove('sd-reframe-anim');
        });
      }, 550);
    }

    // ---------- Legacy <-> sequence mode switching ----------
    function sdExitSequenceMode(video, loopEl) {
      const showcase = document.querySelector('.signature-drinks-showcase');
      const wasActive = sdSeqState.active;
      sdSeqState.active = false;
      sdSeqState.framing = null;
      if (showcase) {
        showcase.classList.remove('sd-seq-mode');
        showcase.removeAttribute('data-sd-framing');
      }
      sdClearFraming(video);
      sdClearFraming(document.getElementById('drink-image'));
      if (video) {
        video.style.visibility = '';
        video.loop = true;
        video.setAttribute('loop', '');
      }
      if (loopEl && (wasActive || loopEl.getAttribute('src'))) {
        loopEl.pause();
        loopEl.removeAttribute('src');
        try { loopEl.load(); } catch (e) {}
      }
      if (loopEl) {
        sdClearFraming(loopEl);
        loopEl.style.display = 'none';
        loopEl.style.opacity = '0';
      }
    }

    function sdPlaySequence(config, img, build, loop, gen) {
      const logo = document.getElementById('brand-logo-container');
      const showcase = document.querySelector('.signature-drinks-showcase');
      const stale = () => gen !== sdSeqGen;
      const cleanups = [];
      const on = (el, ev, fn) => { el.addEventListener(ev, fn); cleanups.push(() => el.removeEventListener(ev, fn)); };
      const later = (fn, ms) => { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; };
      let rvfcHandle = 0;
      sdSeqCleanup = () => {
        cleanups.forEach(f => { try { f(); } catch (e) {} });
        if (rvfcHandle && build.cancelVideoFrameCallback) {
          try { build.cancelVideoFrameCallback(rvfcHandle); } catch (e) {}
        }
      };

      const buildSrc = sdFirstStr(
        config.buildVideo, config.buildVideoUrl, config.abVideo, config.abVideoUrl,
        config.partAVideo, config.pouringVideo, config.introVideo, config.build_video
      );
      const explicitLoop = sdFirstStr(
        config.loopVideo, config.loopVideoUrl, config.bbVideo, config.bbVideoUrl,
        config.partBVideo, config.spinVideo, config.loop_video
      );
      const loopSrc = explicitLoop || sdFirstStr(config.video, config.videoUrl);
      const buildUrl = sdAbsUrl(buildSrc);
      const loopUrl = sdAbsUrl(loopSrc);

      if (logo) logo.classList.add('logo-loading');

      // Never show the static fallback poster while the video buffers; keep it hidden unless playback fails
      sdHideFallbackImg(img);

      // Clear any stale loop source from a prior drink so previous metadata cannot shift initial framing
      // and so (ab) gets 100% of initial download bandwidth first.
      if (loop.src !== loopUrl) {
        loop.pause();
        loop.removeAttribute('src');
        try { loop.load(); } catch (e) {}
      }

      [build, loop].forEach(v => {
        v.classList.add('sd-instant');
        v.muted = true;
        v.playsInline = true;
        v.removeAttribute('poster');
        v.removeAttribute('crossorigin');
        v.crossOrigin = null;
        v.setAttribute('muted', '');
        v.setAttribute('playsinline', '');
        v.style.display = 'block';
        v.classList.remove('hidden');
        v.style.transform = 'none';
        v.style.visibility = 'visible';
      });
      build.style.opacity = '0';
      loop.style.opacity = '0.001';
      loop.loop = true;
      loop.setAttribute('loop', '');

      sdSeqState.active = true;
      sdSeqState.framing = sdNormalizeFraming(config.framing);
      if (showcase) showcase.classList.add('sd-seq-mode');

      // Snap framing coordinates instantaneously while completely invisible (zero position shift)
      sdLayoutVideos();
      void build.offsetWidth;
      void loop.offsetWidth;
      build.classList.remove('sd-instant');
      loop.classList.remove('sd-instant');

      // Prioritize (ab) build layer first so first frame decodes as fast as possible
      build.loop = false;
      build.removeAttribute('loop');
      build.preload = 'auto';
      if (build.src !== buildUrl) {
        build.src = buildSrc;
        build.load();
      } else {
        build.pause();
        try { build.currentTime = 0; } catch (e) {}
      }

      let loopPreloadStarted = (loop.src === loopUrl && loop.readyState >= 1);
      const startLoopPreload = () => {
        if (stale() || loopPreloadStarted) return;
        loopPreloadStarted = true;
        loop.loop = true;
        loop.setAttribute('loop', '');
        loop.preload = 'auto';
        loop.pause();
        if (loop.src !== loopUrl) {
          loop.src = loopSrc;
          loop.load();
        } else {
          try { loop.currentTime = 0; } catch (e) {}
        }
      };

      let swapped = false;
      let pendingSwap = false;
      let buildStarted = false;
      let loopPrimed = false;
      let stallTimer = 0;
      const clearStall = () => { if (stallTimer) { clearTimeout(stallTimer); stallTimer = 0; } };
      cleanups.push(clearStall);

      const setLoopOpaqueInstant = () => {
        loop.classList.add('sd-instant');
        loop.style.opacity = '1';
        void loop.offsetWidth;
      };

      const finishLoading = () => { if (logo) logo.classList.remove('logo-loading'); };

      // Warm up (bb) hardware decoder once (ab) is actively playing and buffer is ready
      const primeLoopDecoder = () => {
        if (stale() || swapped || loopPrimed || !buildStarted) return;
        if (build.currentTime <= 0.9 || loop.readyState < 3) return;
        const dur = build.duration;
        if (isFinite(dur) && dur > 0 && (dur - build.currentTime) <= 1.2) return;
        loopPrimed = true;
        const pr = loop.play();
        if (pr && pr.then) {
          pr.then(() => {
            if (stale() || swapped) return;
            loop.pause();
            try { loop.currentTime = 0; } catch (e) {}
          }).catch(() => {});
        }
      };

      const showImageFallback = (playFn) => {
        if (config.img) {
          img.classList.add('sd-instant');
          img.src = config.img;
          img.style.display = 'block';
          img.classList.remove('hidden');
          img.style.transform = 'none';
          sdLayoutVideos();
          void img.offsetWidth;
          img.classList.remove('sd-instant');
          img.style.opacity = '1';
        } else {
          build.style.opacity = '0.2';
        }
        const forcePlay = () => {
          document.removeEventListener('click', forcePlay);
          document.removeEventListener('touchend', forcePlay);
          if (stale()) return;
          playFn().then(() => {
            if (stale()) return;
            if (!swapped) {
              buildStarted = true;
              build.style.opacity = '1';
            }
            sdHideFallbackImg(img);
          }).catch(err => console.log('Gesture play failed:', err));
        };
        document.addEventListener('click', forcePlay);
        document.addEventListener('touchend', forcePlay);
        cleanups.push(() => {
          document.removeEventListener('click', forcePlay);
          document.removeEventListener('touchend', forcePlay);
        });
      };

      // Atomic handover: loop (bb) sits preloaded behind build (ab); flip instantly on final frame
      const swap = () => {
        if (stale() || swapped) return;
        startLoopPreload();
        if (loop.readyState < 2 || loop.seeking) { pendingSwap = true; return; }
        swapped = true;
        pendingSwap = false;
        clearStall();
        loop.loop = true;
        loop.setAttribute('loop', '');
        setLoopOpaqueInstant();
        build.classList.add('sd-instant');
        const p = loop.play();
        build.style.visibility = 'hidden';
        build.style.opacity = '0';
        build.pause();
        finishLoading();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          loop.classList.remove('sd-instant');
          build.classList.remove('sd-instant');
        }));
        if (p && p.catch) {
          p.catch(err => {
            console.log('Loop playback blocked:', err);
            showImageFallback(() => loop.play());
          });
        }
      };

      // Build failed / stalled: go straight to the loop.
      const goLoopDirect = (reason) => {
        if (stale() || swapped) return;
        swapped = true;
        clearStall();
        console.log('Drink build clip skipped (' + reason + '), starting loop.');
        startLoopPreload();
        build.pause();
        build.style.visibility = 'hidden';
        build.style.opacity = '0';
        loop.loop = true;
        loop.setAttribute('loop', '');
        setLoopOpaqueInstant();
        const p = loop.play();
        requestAnimationFrame(() => requestAnimationFrame(() => loop.classList.remove('sd-instant')));
        if (p && p.then) {
          p.then(() => {
            finishLoading();
            if (!stale()) sdHideFallbackImg(img);
          }).catch(err => {
            console.log('Loop autoplay blocked:', err);
            finishLoading();
            showImageFallback(() => loop.play());
          });
        }
      };

      // Retry deferred swap & warm decoder once loop frames become available
      ['loadeddata', 'canplay', 'canplaythrough', 'seeked'].forEach(ev => {
        on(loop, ev, () => {
          primeLoopDecoder();
          if (pendingSwap) swap();
        });
      });
      on(loop, 'ended', () => {
        if (stale() || !swapped) return;
        try { loop.currentTime = 0; } catch (e) {}
        const pr = loop.play();
        if (pr && pr.catch) pr.catch(() => {});
      });
      on(loop, 'error', () => {
        if (stale()) return;
        if (swapped) {
          finishLoading();
          showImageFallback(() => loop.play());
        }
      });
      on(loop, 'loadedmetadata', sdScheduleLayout);
      on(build, 'loadedmetadata', sdScheduleLayout);
      on(build, 'loadeddata', () => {
        if (!stale() && !swapped) startLoopPreload();
      });

      on(build, 'timeupdate', () => {
        if (stale() || swapped) return;
        primeLoopDecoder();
        const dur = build.duration;
        if (isFinite(dur) && dur > 0 && build.currentTime >= dur - 0.04) {
          swap();
        }
      });
      on(build, 'ended', swap); // fallback when requestVideoFrameCallback is unavailable / overshoots
      on(build, 'error', () => goLoopDirect('error'));
      on(build, 'playing', () => {
        if (stale() || swapped) return;
        buildStarted = true;
        startLoopPreload();
        build.style.opacity = '1';
        clearStall();
        sdHideFallbackImg(img);
      });
      on(build, 'waiting', () => {
        if (!buildStarted || swapped) return;
        clearStall();
        stallTimer = setTimeout(() => goLoopDirect('stalled'), 4000);
      });

      // Preferred: detect the build's last presented frame via requestVideoFrameCallback,
      // then swap exactly one frame-duration later for seamless transition to (bb).
      if (typeof build.requestVideoFrameCallback === 'function') {
        let lastT = -1;
        let frameDur = 0;
        const onFrame = (now, md) => {
          rvfcHandle = 0;
          if (stale() || swapped) return;
          if (!buildStarted && build.readyState >= 2) {
            buildStarted = true;
            startLoopPreload();
            build.style.opacity = '1';
            clearStall();
            sdHideFallbackImg(img);
          }
          const t = md && typeof md.mediaTime === 'number' ? md.mediaTime : build.currentTime;
          if (lastT >= 0 && t > lastT) {
            const d = t - lastT;
            if (d > 0.004 && d < 0.2) frameDur = frameDur ? Math.min(frameDur, d) : d;
          }
          lastT = t;
          const fd = frameDur || (1 / 30);
          const dur = build.duration;
          if (isFinite(dur) && dur > 0 && t >= dur - fd * 1.25) {
            const shownAt = (md && md.expectedDisplayTime) || now;
            const wait = Math.max(0, shownAt + fd * 1000 - performance.now() - 4);
            later(swap, wait);
            return;
          }
          rvfcHandle = build.requestVideoFrameCallback(onFrame);
        };
        rvfcHandle = build.requestVideoFrameCallback(onFrame);
      }

      // Never-started watchdog (network stall before the first frame)
      stallTimer = setTimeout(() => { if (!buildStarted) goLoopDirect('timeout'); }, 8000);

      const playPromise = build.play();
      if (playPromise !== undefined && playPromise.then) {
        playPromise.then(() => {
          if (stale() || swapped) return;
          if (build.readyState >= 2) {
            buildStarted = true;
            startLoopPreload();
            build.style.opacity = '1';
          }
          finishLoading();
          // Make loop opaque invisibly beneath opaque build so swap is a pure instant visibility flip
          later(() => {
            if (!stale() && !swapped && buildStarted) setLoopOpaqueInstant();
          }, 850);
        }).catch(error => {
          if (stale()) return;
          console.log('Autoplay blocked by Chrome/sandboxing:', error);
          clearStall();
          finishLoading();
          showImageFallback(() => build.play());
        });
      }
    }

    function updateMedia(config, img, video) {
      // Cancel every pending listener/timer of the previously selected drink
      sdSeqGen++;
      const gen = sdSeqGen;
      if (sdSeqCleanup) {
        try { sdSeqCleanup(); } catch (e) {}
        sdSeqCleanup = null;
      }
      video.classList.remove('sd-instant');
      config = sdResolveConfig(config);
      const loopEl = document.getElementById('drink-video-loop');
      if (loopEl && sdIsSequenceConfig(config)) {
        sdPlaySequence(config, img, video, loopEl, gen);
        return;
      }
      video.classList.add('sd-instant');
      sdExitSequenceMode(video, loopEl);
      void video.offsetWidth;
      video.classList.remove('sd-instant');

      const cleanups = [];
      const on = (el, ev, fn) => { el.addEventListener(ev, fn); cleanups.push(() => el.removeEventListener(ev, fn)); };
      sdSeqCleanup = () => {
        cleanups.forEach(f => { try { f(); } catch (e) {} });
      };

      const logo = document.getElementById('brand-logo-container');
      if (config.video) {
        if (logo) logo.classList.add('logo-loading');
        // Never show the static fallback image while buffering; only surface it if playback fails or is blocked
        sdHideFallbackImg(img);

        video.classList.add('sd-instant');
        video.style.display = 'block';
        video.classList.remove('hidden');
        video.style.opacity = '0';
        video.style.transform = 'none';
        void video.offsetWidth;
        video.classList.remove('sd-instant');

        // Mute and playsinline to comply with autoplay rules
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.removeAttribute('poster');
        video.removeAttribute('crossorigin');
        video.crossOrigin = null;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');

        // Force load the new video source
        const newSrc = new URL(config.video, window.location.href).href;
        if (video.src !== newSrc) {
          video.src = config.video;
          video.load();
        } else {
          try { video.currentTime = 0; } catch (e) {}
        }

        const revealSingleVideo = () => {
          if (sdSeqGen !== gen) return;
          video.style.opacity = '1';
          if (logo) logo.classList.remove('logo-loading');
          sdHideFallbackImg(img);
        };

        const showSingleImageFallback = () => {
          if (sdSeqGen !== gen) return;
          if (config.img) {
            img.classList.add('sd-instant');
            img.src = config.img;
            img.style.display = 'block';
            img.classList.remove('hidden');
            img.style.transform = 'none';
            void img.offsetWidth;
            img.classList.remove('sd-instant');
            img.style.opacity = '1';
          } else {
            video.style.opacity = '0.2';
          }
          if (logo) logo.classList.remove('logo-loading');
          const forcePlay = () => {
            document.removeEventListener('click', forcePlay);
            document.removeEventListener('touchend', forcePlay);
            if (sdSeqGen !== gen) return;
            video.play().then(() => {
              revealSingleVideo();
            }).catch(err => console.log('Gesture play failed:', err));
          };
          document.addEventListener('click', forcePlay);
          document.addEventListener('touchend', forcePlay);
          cleanups.push(() => {
            document.removeEventListener('click', forcePlay);
            document.removeEventListener('touchend', forcePlay);
          });
        };

        on(video, 'playing', revealSingleVideo);
        on(video, 'error', () => {
          console.log('Video playback error, using fallback:', config.video);
          showSingleImageFallback();
        });

        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            if (sdSeqGen !== gen) return;
            if (video.readyState >= 2) {
              revealSingleVideo();
            }
          }).catch(error => {
            if (sdSeqGen !== gen) return;
            console.log('Autoplay blocked by Chrome/sandboxing:', error);
            showSingleImageFallback();
          });
        }
      } else {
        // Hide Video, Show Image
        video.style.display = 'none';
        video.classList.add('hidden');
        video.style.opacity = '0';
        video.pause();
        video.removeAttribute('src');

        if (config.img) {
          img.classList.add('sd-instant');
          img.style.display = 'block';
          img.classList.remove('hidden');
          img.style.transform = 'none';
          img.src = config.img;
          void img.offsetWidth;
          img.classList.remove('sd-instant');
          img.style.opacity = '1';
        } else {
          sdHideFallbackImg(img);
        }

        if (logo) logo.classList.remove('logo-loading');
      }
    }

      const nextKey = drinkKeys[nextIndex];

      showDrink(nextKey, nextButton);

      // 8. Video loading state events to pulse the brand logo during load times

      // 8b. Smart framing recompute for 2-part sequences (guarded: width changes > 2px only,
      // so Square's height poller / mobile URL-bar resizes never cause feedback loops)
      let sdLastWidth = window.innerWidth;
      const onWinResize = () => {
        if (Math.abs(window.innerWidth - sdLastWidth) > 2) {
          sdLastWidth = window.innerWidth;
          if (window.innerWidth < 1024 && panelManuallyClosed) {
            panelManuallyClosed = false;
            revealPanel();
          }
          sdScheduleLayout();
        }
      };
      window.addEventListener('resize', onWinResize);

      // Fallback timer: if live CRM takes longer than 650ms, start the compiled fallback immediately
      const fallbackTimer = setTimeout(() => {
        if (initialRenderDone || userHasInteracted) return;
        initialRenderDone = true;

        const startKey = (reqKey && drinks[reqKey]) ? reqKey : (drinks[currentDrinkKey] ? currentDrinkKey : Object.keys(drinks)[0]);

      syncDrinksFromNucleusCrm().finally(() => {

          const reqKey = sdGetRequestedDrinkKey();

          if (startKey) showDrink(startKey, startBtn, { immediate: true });
        }
      });
    }

    function unwrapFirestoreValue(val) {
      if (!val || typeof val !== 'object') return val;
      if ('stringValue' in val) return val.stringValue;
      if ('booleanValue' in val) return Boolean(val.booleanValue);
      if ('integerValue' in val) return Number(val.integerValue);
      if ('doubleValue' in val) return Number(val.doubleValue);
      if ('nullValue' in val) return null;
      if ('arrayValue' in val) {
        return ((val.arrayValue && val.arrayValue.values) || []).map(unwrapFirestoreValue);
      }
      if ('mapValue' in val) {
        const fields = (val.mapValue && val.mapValue.fields) || {};
        const out = {};
        Object.keys(fields).forEach(k => {
          out[k] = unwrapFirestoreValue(fields[k]);
        });
        return out;
      }
      return val;
    }

    async function fetchCrmSignatureDrinksData() {
      const CRM_WIDGET_API_URL = 'https://nucleuscloud.net/api/widget/crm/nYaZ4T5qRKS3Z9EG5mrl/signature-drinks';
      const CRM_FIRESTORE_URL = 'https://firestore.googleapis.com/v1/projects/bizboard-67b4c/databases/(default)/documents/businesses/nYaZ4T5qRKS3Z9EG5mrl/public_data/signature_drinks';
      try {
        const res = await fetch(CRM_WIDGET_API_URL, { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.categories) && Array.isArray(json.drinks)) {
            return json;
          }
        }
      } catch (e) {}
      try {
        const res = await fetch(CRM_FIRESTORE_URL, { cache: 'no-store' });
        if (!res.ok) return null;
        const rawDoc = await res.json();
        if (!rawDoc || !rawDoc.fields) return null;
        return unwrapFirestoreValue({ mapValue: { fields: rawDoc.fields } });
      } catch (e) {
        return null;
      }
    }

    async function syncDrinksFromNucleusCrm() {
      try {
        const data = await fetchCrmSignatureDrinksData();
        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.drinks)) return;

        // Sync global CRM header/menu metadata
        if (typeof data.title === 'string' && data.title.trim()) {
          const desktopTitle = document.getElementById('crm-collections-title');
          const mobileTitle = document.getElementById('mobile-collections-title');
          if (desktopTitle) desktopTitle.textContent = data.title.trim();
          if (mobileTitle) mobileTitle.textContent = data.title.trim();
        }
        if (typeof data.subtitle === 'string' && data.subtitle.trim()) {
          const subtitleEl = document.getElementById('drink-subtitle');
          if (subtitleEl) subtitleEl.textContent = data.subtitle.trim();
        }
        if (typeof data.viewFullMenuUrl === 'string' && data.viewFullMenuUrl.trim()) {
          const fullMenuBtn = document.getElementById('view-full-menu-btn');
          if (fullMenuBtn) fullMenuBtn.setAttribute('href', data.viewFullMenuUrl.trim());
        }
        if (typeof data.orderNowUrl === 'string' && data.orderNowUrl.trim()) {
          crmOrderNowUrl = data.orderNowUrl.trim();
        }

        const visibleCategories = data.categories
          .filter(c => c && c.visible !== false)
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

        const visibleDrinks = data.drinks
          .filter(d => d && d.visible !== false)
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

        if (!visibleCategories.length || !visibleDrinks.length) return;

        // Capture previous active media signature before replacing live drinks map
        const prevDrink = drinks[currentDrinkKey];
        const prevCfg = prevDrink ? (prevDrink.hasTempToggle ? (prevDrink[currentDrinkTemp] || prevDrink) : prevDrink) : null;
        const mediaSig = (c) => c ? [
          c.video ? sdAbsUrl(c.video) : '',
          c.buildVideo ? sdAbsUrl(c.buildVideo) : '',
          c.loopVideo ? sdAbsUrl(c.loopVideo) : '',
          JSON.stringify(c.framing || null)
        ].join('|') : '';
        const prevMediaSig = mediaSig(prevCfg);
        Object.keys(drinks).forEach(k => delete drinks[k]);

        const navEl = document.querySelector('aside.sidebar-slide nav');
        if (!navEl) return;

        // Preserve the "View Full Menu" footer block inside <nav>
        const footerCta = navEl.querySelector('.pt-4.mb-2');
        navEl.innerHTML = '';

        const reqKey = sdGetRequestedDrinkKey();
        let firstCrmKey = '';

        visibleCategories.forEach((cat) => {
          const catDrinks = visibleDrinks.filter(d => d.categoryId === cat.id);
          if (!catDrinks.length) return;

          const groupDiv = document.createElement('div');
          groupDiv.className = 'category-group';
          groupDiv.id = cat.id;

          const headerBtn = document.createElement('button');
          headerBtn.className = 'w-full flex items-center justify-between text-marble-white/50 hover:text-marble-white transition-custom py-2 uppercase tracking-[0.2em] text-xs font-bold';
          const catNameSpan = document.createElement('span');
          catNameSpan.className = 'pointer-events-none';
          catNameSpan.textContent = cat.name || '';
          const catChevSpan = document.createElement('span');
          catChevSpan.className = 'material-symbols-outlined text-sm transition-custom category-chevron pointer-events-none';
          catChevSpan.textContent = 'expand_more';
          headerBtn.appendChild(catNameSpan);
          headerBtn.appendChild(catChevSpan);
          headerBtn.addEventListener('click', (e) => {
            e.preventDefault();
            userHasInteracted = true;
            toggleCategory(cat.id);
          });
          groupDiv.addEventListener('mouseenter', () => hoverCategory(cat.id));

          const contentDiv = document.createElement('div');
          contentDiv.className = 'category-content flex flex-col gap-4 pl-2 border-l border-white/5';

          catDrinks.forEach((d) => {
            const key = d.key || d.id;
            if (!firstCrmKey) firstCrmKey = key;
            const media = sdExtractMedia(d);
            drinks[key] = {
              title: d.title || '',
              text: d.text || '',
              img: media.img,
              video: media.video,
              buildVideo: media.buildVideo,
              loopVideo: media.loopVideo,
              framing: media.framing,
              price: d.price || '',
              ambient: media.ambient || '#1C2E1F',
              orderUrl: sdFirstStr(d.orderUrl, crmOrderNowUrl),
              hasTempToggle: Boolean(d.hasTempToggle),
              hot: sdNormalizeVariant(d.hot, d),
              iced: sdNormalizeVariant(d.iced, d)
            };

            const itemBtn = document.createElement('button');
            itemBtn.className = 'drink-nav-item group flex items-center gap-4 text-left transition-custom opacity-50 hover:opacity-100';
            itemBtn.setAttribute('data-drink-key', key);
            const navLineSpan = document.createElement('span');
            navLineSpan.className = 'nav-line inactive-nav-line group-hover:w-10 h-px transition-custom';
            const titleSpan = document.createElement('span');
            titleSpan.className = 'text-marble-white text-base tracking-wide font-light transition-custom';
            titleSpan.textContent = d.title || '';
            itemBtn.appendChild(navLineSpan);
            itemBtn.appendChild(titleSpan);
            itemBtn.addEventListener('click', (e) => {
              e.preventDefault();
              userHasInteracted = true;
              showDrink(key, itemBtn);
            });
            contentDiv.appendChild(itemBtn);
          });

          groupDiv.appendChild(headerBtn);
          groupDiv.appendChild(contentDiv);
          navEl.appendChild(groupDiv);
        });

        if (footerCta) {
          navEl.appendChild(footerCta);
        }

        const preferredKey = (reqKey && drinks[reqKey]) ? reqKey : (firstCrmKey || Object.keys(drinks)[0]);
        if (!preferredKey) return;

        if (!initialRenderDone && !userHasInteracted) {
          initialRenderDone = true;
          const targetBtn = expandCategoryForDrink(preferredKey);
          showDrink(preferredKey, targetBtn, { immediate: true });
          return;
        }

        if (!userHasInteracted && preferredKey !== currentDrinkKey) {
          const targetBtn = expandCategoryForDrink(preferredKey);
          showDrink(preferredKey, targetBtn, { immediate: true });
          return;
        }

        if (!drinks[currentDrinkKey]) {
          const firstBtn = expandCategoryForDrink(preferredKey) || navEl.querySelector('.drink-nav-item');
          showDrink(preferredKey, firstBtn, { immediate: true });
          return;
        }

        // Current drink still exists: highlight its sidebar item, expand its category, and refresh content if changed
        const activeBtn = expandCategoryForDrink(currentDrinkKey);
        if (activeBtn) {
          activeBtn.classList.remove('opacity-50');
          const line = activeBtn.querySelector('.nav-line');
          if (line) {
            line.classList.remove('inactive-nav-line');
            line.classList.add('active-nav-line');
          }
        }

        const activeDrink = drinks[currentDrinkKey];
        const activeCfg = activeDrink.hasTempToggle ? (activeDrink[currentDrinkTemp] || activeDrink) : activeDrink;
        if (activeCfg) {
          const titleEl = document.getElementById('drink-title');
          const textEl = document.getElementById('drink-text');
          const priceEl = document.getElementById('drink-price');
          if (titleEl) titleEl.innerText = activeCfg.title;
          if (textEl) textEl.innerText = activeCfg.text;
          if (priceEl) priceEl.innerText = activeCfg.price;
          applyAmbientColor(activeCfg.ambient, activeCfg);
          applyOrderLink(activeCfg.orderUrl ? activeCfg : activeDrink);
          if (mediaSig(activeCfg) !== prevMediaSig && (activeCfg.video || activeCfg.img || sdIsSequenceConfig(activeCfg))) {
            updateMedia(activeCfg, document.getElementById('drink-image'), document.getElementById('drink-video'));
          }
        }
      } catch (err) {
        console.warn('Nucleus CRM live sync skipped (using compiled fallback):', err);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initDrinksShowcase();
    } else {
      document.addEventListener('DOMContentLoaded', initDrinksShowcase);
    }
  })();
  </script>
