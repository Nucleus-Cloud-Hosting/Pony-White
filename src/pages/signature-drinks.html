    // =====================================================================
    // 2-PART DRINK VIDEO SEQUENCE ENGINE
    // buildVideo plays once (ingredients drop into the spinning glass), then
    // loopVideo (the finished drink spinning) takes over seamlessly and
    // repeats forever. Loop frame 0 continues build's last frame.
    // =====================================================================
    let sdSeqGen = 0;            // generation token: bumps on every media change
    let sdSeqCleanup = null;     // tears down listeners/timers of the previous generation
    const sdSeqState = { active: false, framing: null };
    let sdOverrideDefaultKey = null;

    function sdIsSequenceConfig(cfg) {
      return Boolean(cfg && typeof cfg.buildVideo === 'string' && cfg.buildVideo.trim() &&
        typeof cfg.loopVideo === 'string' && cfg.loopVideo.trim());
    }

    function sdNormalizeFraming(fr) {
      if (!fr || typeof fr !== 'object') return null;
      const n = (v) => (typeof v === 'number' && isFinite(v)) ? v : parseFloat(v);
      const safeW = n(fr.safeW), safeH = n(fr.safeH), cx = n(fr.cx), cy = n(fr.cy);
      if (![safeW, safeH, cx, cy].every(v => isFinite(v) && v >= 0 && v <= 1)) return null;
      if (safeW <= 0 || safeH <= 0) return null;
      return { safeW, safeH, cx, cy };
    }

    function sdNormalizeVariant(v) {
      if (!v || typeof v !== 'object') return null;
      return Object.assign({}, v, {
        buildVideo: typeof v.buildVideo === 'string' ? v.buildVideo : '',
        loopVideo: typeof v.loopVideo === 'string' ? v.loopVideo : '',
        framing: sdNormalizeFraming(v.framing)
      });
    }

    // Debug-only QA override (inert unless explicitly requested):
    //   ?sdSeqTest=<buildUrl>|<loopUrl>[&sdSeqFraming=safeW,safeH,cx,cy][&sdSeqDrink=<drinkKey>]
    //   or window.PW_SEQUENCE_OVERRIDE = { buildVideo, loopVideo, framing?, drinkKey? }
    // Applies to a single drink only (sdSeqDrink / drinkKey, else the first drink shown).
    function sdGetSequenceOverride() {
      try {
        let o = null;
        if (window.PW_SEQUENCE_OVERRIDE && typeof window.PW_SEQUENCE_OVERRIDE === 'object') {
          o = Object.assign({}, window.PW_SEQUENCE_OVERRIDE);
        }
        const qs = new URLSearchParams(window.location.search || '');
        const raw = qs.get('sdSeqTest');
        if (raw && raw.indexOf('|') > 0) {
          const parts = raw.split('|');
          o = { buildVideo: parts[0], loopVideo: parts[1] };
          const fr = qs.get('sdSeqFraming');
          if (fr) {
            const f = fr.split(',').map(parseFloat);
            o.framing = { safeW: f[0], safeH: f[1], cx: f[2], cy: f[3] };
          }
          if (qs.get('sdSeqDrink')) o.drinkKey = qs.get('sdSeqDrink');
        }
        if (!o || !sdIsSequenceConfig(o)) return null;
        return o;
      } catch (e) {
        return null;
      }
    }

    function sdApplyOverride(config) {
      const o = sdGetSequenceOverride();
      if (!o) return config;
      if (!sdOverrideDefaultKey) sdOverrideDefaultKey = o.drinkKey || currentDrinkKey;
      if (currentDrinkKey !== (o.drinkKey || sdOverrideDefaultKey)) return config;
      return Object.assign({}, config, {
        buildVideo: o.buildVideo,
        loopVideo: o.loopVideo,
        video: o.loopVideo,
        framing: o.framing !== undefined ? sdNormalizeFraming(o.framing) : config.framing
      });
    }

    function sdResolveConfig(config) {
      return config ? sdApplyOverride(config) : config;
    }

    function sdAbsUrl(u) {
      try { return new URL(u, window.location.href).href; } catch (e) { return u; }
    }

    // ---------- Smart framing: keep the whole drink visible ----------
    function sdClearFraming(v) {
      if (!v) return;
      v.classList.remove('sd-framed', 'sd-feather');
      ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(p => { v.style[p] = ''; });
    }

    function sdIsDescriptionVisible(desc) {
      if (!desc) return false;
      if (desc.style.display === 'none' || desc.classList.contains('panel-hidden')) return false;
      return desc.offsetWidth > 0 && desc.offsetHeight > 0;
    }

    function sdLayoutVideos() {
      const build = document.getElementById('drink-video');
      const loop = document.getElementById('drink-video-loop');
      const showcase = document.querySelector('.signature-drinks-showcase');
      if (!build || !loop || !showcase) return;
      const fr = sdSeqState.framing;
      if (!sdSeqState.active || !fr) {
        sdClearFraming(build);
        sdClearFraming(loop);
        return;
      }

      const cr = showcase.getBoundingClientRect();
      const W = cr.width, H = cr.height;
      if (W < 2 || H < 2) return;
      const vw = loop.videoWidth || build.videoWidth || 1920;
      const vh = loop.videoWidth ? loop.videoHeight : (build.videoHeight || 1080);

      // Available rect (container coordinates) = container minus occluders.
      // Layout positions (offsetLeft/offsetTop) are used so in-flight transforms don't skew the result.
      let ax0 = 0, ax1 = W, ay0 = 0, ay1 = H;
      const desc = document.getElementById('drink-description');
      const mainEl = desc ? desc.offsetParent : null;
      const descVisible = sdIsDescriptionVisible(desc);
      let descLeft = null, descTop = null;
      if (descVisible && mainEl) {
        const mr = mainEl.getBoundingClientRect();
        descLeft = mr.left - cr.left + desc.offsetLeft;
        descTop = mr.top - cr.top + desc.offsetTop;
      }

      if (window.innerWidth >= 768) {
        const aside = document.querySelector('aside.sidebar-slide');
        const asideRight = aside ? (aside.getBoundingClientRect().right - cr.left) : null;
        const minW = 0.35 * W;
        // Prefer honouring both occluders; when they overlap (narrow tablets) honour the
        // frosted description card first (the sidebar is transparent text on >=768px).
        if (asideRight !== null && descLeft !== null && (descLeft - asideRight) >= minW) {
          ax0 = asideRight; ax1 = descLeft;
        } else if (descLeft !== null && descLeft >= minW) {
          ax1 = descLeft;
        } else if (asideRight !== null && (W - asideRight) >= minW) {
          ax0 = asideRight;
        }
      } else if (descTop !== null && descTop >= 0.35 * H) {
        ay1 = Math.min(H, descTop);
      }

      const availW = Math.max(1, ax1 - ax0), availH = Math.max(1, ay1 - ay0);
      const acx = (ax0 + ax1) / 2, acy = (ay0 + ay1) / 2;
      const sCover = Math.max(W / vw, H / vh);
      const sFit = Math.min(availW / (fr.safeW * vw), availH / (fr.safeH * vh)) * 0.94;

      // Attempt 1: cover the container, safe box centred in the available rect, clamped to keep full coverage.
      let dw = vw * sCover, dh = vh * sCover;
      let left = Math.min(0, Math.max(W - dw, acx - fr.cx * dw));
      let top = Math.min(0, Math.max(H - dh, acy - fr.cy * dh));
      const eps = 0.5;
      const sx0 = left + (fr.cx - fr.safeW / 2) * dw, sx1 = left + (fr.cx + fr.safeW / 2) * dw;
      const sy0 = top + (fr.cy - fr.safeH / 2) * dh, sy1 = top + (fr.cy + fr.safeH / 2) * dh;
      const coverOk = sx0 >= ax0 - eps && sx1 <= ax1 + eps && sy0 >= ay0 - eps && sy1 <= ay1 + eps;

      let feather = false;
      if (!coverOk) {
        // Attempt 2: shrink until the safe box fits, centred on the available rect (no clamping).
        const s = Math.min(sCover, sFit);
        dw = vw * s; dh = vh * s;
        left = acx - fr.cx * dw;
        top = acy - fr.cy * dh;
        feather = left > eps || top > eps || (left + dw) < W - eps || (top + dh) < H - eps;
      }

      // Radial feather centred on the safe box; solid core always contains the safe box.
      const rx = Math.max(0.05, Math.min(fr.cx, 1 - fr.cx));
      const ry = Math.max(0.05, Math.min(fr.cy, 1 - fr.cy));
      const need = Math.sqrt(Math.pow((fr.safeW / 2) / rx, 2) + Math.pow((fr.safeH / 2) / ry, 2));
      const solid = Math.max(0.55, Math.min(0.92, need * 1.04));

      [build, loop].forEach(v => {
        v.classList.add('sd-framed');
        v.classList.toggle('sd-feather', feather);
        v.style.left = left.toFixed(2) + 'px';
        v.style.top = top.toFixed(2) + 'px';
        v.style.width = dw.toFixed(2) + 'px';
        v.style.height = dh.toFixed(2) + 'px';
        v.style.right = 'auto';
        v.style.bottom = 'auto';
        v.style.setProperty('--sd-mrx', (rx * 100).toFixed(2) + '%');
        v.style.setProperty('--sd-mry', (ry * 100).toFixed(2) + '%');
        v.style.setProperty('--sd-mcx', (fr.cx * 100).toFixed(2) + '%');
        v.style.setProperty('--sd-mcy', (fr.cy * 100).toFixed(2) + '%');
        v.style.setProperty('--sd-msolid', (solid * 100).toFixed(1) + '%');
      });
      showcase.setAttribute('data-sd-framing', coverOk ? 'cover' : (feather ? 'fit-feather' : 'fit'));
    }

    let sdLayoutRaf = 0;
    function sdScheduleLayout() {
      if (sdLayoutRaf) cancelAnimationFrame(sdLayoutRaf);
      sdLayoutRaf = requestAnimationFrame(() => {
        sdLayoutRaf = 0;
        sdLayoutVideos();
      });
    }

    // ---------- Legacy <-> sequence mode switching ----------
    function sdExitSequenceMode(video, loopEl) {
      const showcase = document.querySelector('.signature-drinks-showcase');
      const wasActive = sdSeqState.active;
      sdSeqState.active = false;
      sdSeqState.framing = null;
      if (showcase) {
        showcase.classList.remove('sd-seq-mode');
        showcase.removeAttribute('data-sd-framing');
      }
      sdClearFraming(video);
      if (video) {
        video.style.visibility = '';
        video.loop = true;
        video.setAttribute('loop', '');
      }
      if (loopEl && (wasActive || loopEl.getAttribute('src'))) {
        loopEl.pause();
        loopEl.removeAttribute('src');
        try { loopEl.load(); } catch (e) {}
      }
      if (loopEl) {
        sdClearFraming(loopEl);
        loopEl.style.display = 'none';
        loopEl.style.opacity = '0';
      }
    }

    function sdPlaySequence(config, img, build, loop, gen) {
      const logo = document.getElementById('brand-logo-container');
      const showcase = document.querySelector('.signature-drinks-showcase');
      const stale = () => gen !== sdSeqGen;
      const cleanups = [];
      const on = (el, ev, fn) => { el.addEventListener(ev, fn); cleanups.push(() => el.removeEventListener(ev, fn)); };
      const later = (fn, ms) => { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; };
      let rvfcHandle = 0;
      sdSeqCleanup = () => {
        cleanups.forEach(f => { try { f(); } catch (e) {} });
        if (rvfcHandle && build.cancelVideoFrameCallback) {
          try { build.cancelVideoFrameCallback(rvfcHandle); } catch (e) {}
        }
      };

      sdSeqState.active = true;
      sdSeqState.framing = sdNormalizeFraming(config.framing);
      if (showcase) showcase.classList.add('sd-seq-mode');
      if (logo) logo.classList.add('logo-loading');

      // Keep high-res fallback poster visible beneath the build video until playback begins
      if (config.img) {
        img.src = config.img;
        img.style.display = 'block';
        img.classList.remove('hidden');
        img.style.opacity = '1';
        img.style.transform = 'none';
      } else {
        img.style.display = 'none';
        img.classList.add('hidden');
        img.style.opacity = '0';
        img.src = '';
      }

      [build, loop].forEach(v => {
        if (v.style.visibility === 'hidden') {
          // Layer was hidden (e.g. build after a swap): reset opacity instantly so it never re-appears mid-fade
          v.classList.add('sd-instant');
          v.style.opacity = '0';
          void v.offsetWidth;
          v.classList.remove('sd-instant');
        }
        v.muted = true;
        v.playsInline = true;
        v.removeAttribute('crossorigin');
        v.crossOrigin = null;
        v.setAttribute('muted', '');
        v.setAttribute('playsinline', '');
        v.style.display = 'block';
        v.classList.remove('hidden');
        v.style.transform = 'none';
        v.style.visibility = 'visible';
        v.style.opacity = '0';
      });

      // Staggered loading: prioritize the build clip first, then load the loop layer once build begins playing
      const loopUrl = sdAbsUrl(config.loopVideo);
      let loopLoaded = false;
      loop.loop = true;
      loop.setAttribute('loop', '');
      loop.pause();
      if (loop.src !== loopUrl) {
        loop.preload = 'none';
        loop.removeAttribute('src');
        loop.load();
      } else {
        loopLoaded = true;
        try { loop.currentTime = 0; } catch (e) {}
      }

      const ensureLoopLoaded = () => {
        if (loopLoaded || stale()) return;
        loopLoaded = true;
        loop.preload = 'auto';
        if (loop.src !== loopUrl) {
          loop.src = config.loopVideo;
          loop.load();
        } else {
          loop.pause();
          try { loop.currentTime = 0; } catch (e) {}
        }
        loop.pause();
      };

      // Build layer: plays once
      build.loop = false;
      build.removeAttribute('loop');
      build.preload = 'auto';
      const buildUrl = sdAbsUrl(config.buildVideo);
      if (build.src !== buildUrl) {
        build.src = config.buildVideo;
        build.load();
      } else {
        build.pause();
        try { build.currentTime = 0; } catch (e) {}
      }

      sdLayoutVideos();

      let swapped = false;
      let pendingSwap = false;
      let buildStarted = false;
      let stallTimer = 0;
      const clearStall = () => { if (stallTimer) { clearTimeout(stallTimer); stallTimer = 0; } };
      cleanups.push(clearStall);

      const setLoopOpaqueInstant = () => {
        loop.classList.add('sd-instant');
        loop.style.opacity = '1';
        void loop.offsetWidth; // commit the instant change before restoring transitions
        requestAnimationFrame(() => requestAnimationFrame(() => loop.classList.remove('sd-instant')));
      };

      const finishLoading = () => { if (logo) logo.classList.remove('logo-loading'); };

      // Seamless hand-off: loop is paused on frame 0 (== continuation of build's last frame).
      // Hide the build layer in the same task as loop.play() so the next composited frame is loop frame 0.
      const swap = () => {
        if (stale() || swapped) return;
        if (loop.readyState < 2 || loop.seeking) { pendingSwap = true; return; } // build keeps holding its last frame
        swapped = true;
        pendingSwap = false;
        clearStall();
        setLoopOpaqueInstant();
        const p = loop.play();
        build.style.visibility = 'hidden';
        build.pause();
        finishLoading();
        if (p && p.catch) p.catch(err => console.log('Loop playback blocked:', err));
      };

      // Build failed / stalled: go straight to the loop.
      const goLoopDirect = (reason) => {
        if (stale() || swapped) return;
        swapped = true;
        clearStall();
        ensureLoopLoaded();
        console.log('Drink build clip skipped (' + reason + '), starting loop.');
        build.pause();
        build.style.visibility = 'hidden';
        loop.style.opacity = '1';
        const p = loop.play();
        if (p && p.then) {
          p.then(() => {
            finishLoading();
            if (!stale() && config.img) {
              img.style.opacity = '0';
              later(() => {
                if (!stale()) {
                  img.style.display = 'none';
                  img.classList.add('hidden');
                }
              }, 500);
            }
          }).catch(err => {
            console.log('Loop autoplay blocked:', err);
            finishLoading();
            showImageFallback(() => loop.play());
          });
        }
      };

      const showImageFallback = (playFn) => {
        if (config.img) {
          img.src = config.img;
          img.style.display = 'block';
          img.classList.remove('hidden');
          img.style.opacity = '1';
          img.style.transform = 'none';
        } else {
          build.style.opacity = '0.2';
        }
        const forcePlay = () => {
          document.removeEventListener('click', forcePlay);
          document.removeEventListener('touchend', forcePlay);
          if (stale()) return;
          playFn().then(() => {
            if (stale()) return;
            build.style.opacity = '1';
            img.style.opacity = '0';
            setTimeout(() => {
              img.style.display = 'none';
              img.classList.add('hidden');
            }, 500);
          }).catch(err => console.log('Gesture play failed:', err));
        };
        document.addEventListener('click', forcePlay);
        document.addEventListener('touchend', forcePlay);
        cleanups.push(() => {
          document.removeEventListener('click', forcePlay);
          document.removeEventListener('touchend', forcePlay);
        });
      };

      // Retry a deferred swap once the loop's frame 0 is decoded
      ['loadeddata', 'canplay', 'seeked'].forEach(ev => on(loop, ev, () => { if (pendingSwap) swap(); }));
      on(loop, 'loadedmetadata', sdScheduleLayout);
      on(build, 'loadedmetadata', sdScheduleLayout);

      on(build, 'ended', swap); // fallback when requestVideoFrameCallback is unavailable / overshoots
      on(build, 'error', () => goLoopDirect('error'));
      on(build, 'playing', () => {
        buildStarted = true;
        clearStall();
        ensureLoopLoaded();
        if (config.img) {
          img.style.opacity = '0';
          later(() => {
            if (!stale()) {
              img.style.display = 'none';
              img.classList.add('hidden');
            }
          }, 500);
        }
      });
      on(build, 'waiting', () => {
        if (!buildStarted || swapped) return;
        clearStall();
        stallTimer = setTimeout(() => goLoopDirect('stalled'), 4000);
      });

      // Preferred: detect the build's last presented frame via requestVideoFrameCallback,
      // then swap exactly one frame-duration later (the last frame gets its full screen time).
      if (typeof build.requestVideoFrameCallback === 'function') {
        let lastT = -1;
        let frameDur = 0;
        const onFrame = (now, md) => {
          rvfcHandle = 0;
          if (stale() || swapped) return;
          const t = md && typeof md.mediaTime === 'number' ? md.mediaTime : build.currentTime;
          if (lastT >= 0 && t > lastT) {
            const d = t - lastT;
            if (d > 0.004 && d < 0.2) frameDur = frameDur ? Math.min(frameDur, d) : d;
          }
          lastT = t;
          const fd = frameDur || (1 / 30);
          const dur = build.duration;
          if (isFinite(dur) && dur > 0 && t >= dur - fd * 1.5) {
            const shownAt = (md && md.expectedDisplayTime) || now;
            const wait = Math.max(0, shownAt + fd * 1000 - performance.now() - 2);
            later(swap, wait);
            return;
          }
          rvfcHandle = build.requestVideoFrameCallback(onFrame);
        };
        rvfcHandle = build.requestVideoFrameCallback(onFrame);
      }

      // Never-started watchdog (network stall before the first frame)
      stallTimer = setTimeout(() => { if (!buildStarted) goLoopDirect('timeout'); }, 8000);

      const playPromise = build.play();
      if (playPromise !== undefined && playPromise.then) {
        playPromise.then(() => {
          if (stale()) return;
          build.style.opacity = '1';
          finishLoading();
          // Once the build layer is fully opaque, make the loop layer opaque underneath it (invisible change),
          // so the swap is a pure visibility flip with no fade/ghosting.
          later(() => { if (!stale() && !swapped) setLoopOpaqueInstant(); }, 850);
        }).catch(error => {
          if (stale()) return;
          console.log('Autoplay blocked by Chrome/sandboxing:', error);
          clearStall();
          finishLoading();
          showImageFallback(() => build.play());
        });
      }
    }

    function updateMedia(config, img, video) {
      // Cancel every pending listener/timer of the previously selected drink
      sdSeqGen++;
      const gen = sdSeqGen;
      if (sdSeqCleanup) {
        try { sdSeqCleanup(); } catch (e) {}
        sdSeqCleanup = null;
      }
      video.classList.remove('sd-instant');
      config = sdResolveConfig(config);
      const loopEl = document.getElementById('drink-video-loop');
      if (loopEl && sdIsSequenceConfig(config)) {
        sdPlaySequence(config, img, video, loopEl, gen);
        return;
      }
      sdExitSequenceMode(video, loopEl);

      const logo = document.getElementById('brand-logo-container');
      if (config.video) {
        if (logo) logo.classList.add('logo-loading');
        // Keep high-res image visible as poster backdrop while the video buffers
        if (config.img) {
          img.src = config.img;
          img.style.display = 'block';
          img.classList.remove('hidden');
          img.style.opacity = '1';
          img.style.transform = 'scale(1.05)';
        } else {
          img.style.display = 'none';
          img.classList.add('hidden');
          img.style.opacity = '0';
          img.src = '';
        }
        
        video.style.display = 'block';
        video.classList.remove('hidden');
        
        // Mute and playsinline to comply with autoplay rules
        video.muted = true;
        video.playsInline = true;
        video.removeAttribute('crossorigin');
        video.crossOrigin = null;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        
        // Force load the new video source
        const newSrc = new URL(config.video, window.location.href).href;
        if (video.src !== newSrc) {
          video.src = config.video;
          video.load();
        }
        
        // Keep video opacity 0 until it actually starts playing
        video.style.opacity = '0';
        video.style.transform = 'scale(1.05)';
        
        // Attempt immediate playback to trigger active streaming and detect blocks
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            if (sdSeqGen !== gen) return;
            // Success! Fade in the video beautifully and hide poster image
            video.style.opacity = '1';
            if (logo) logo.classList.remove('logo-loading');
            if (config.img) {
              img.style.opacity = '0';
              setTimeout(() => {
                if (sdSeqGen === gen) {
                  img.style.display = 'none';
                  img.classList.add('hidden');
                }
              }, 500);
            }
          }).catch(error => {
            if (sdSeqGen !== gen) return;
            console.log('Autoplay blocked by Chrome/sandboxing:', error);
            // Autoplay is blocked. Reveal the high-res image fallback if available.
            if (config.img) {
              img.src = config.img;
              img.style.display = 'block';
              img.classList.remove('hidden');
              img.style.opacity = '1';
              img.style.transform = 'scale(1.05)';
            } else {
              // No image fallback. Set video to a subtle backdrop opacity.
              video.style.opacity = '0.2';
            }
            
            if (logo) logo.classList.remove('logo-loading');
            
            // Register a click gesture fallback on the entire document to play the video.
            const forcePlay = () => {
              video.play().then(() => {
                video.style.opacity = '1';
                // Hide image fallback once video starts playing
                img.style.opacity = '0';
                setTimeout(() => {
                  img.style.display = 'none';
                  img.classList.add('hidden');
                }, 500);
              }).catch(err => console.log('Gesture play failed:', err));
              document.removeEventListener('click', forcePlay);
              document.removeEventListener('touchend', forcePlay);
            };
            document.addEventListener('click', forcePlay);
            document.addEventListener('touchend', forcePlay);
          });
        }
      } else {
        // Hide Video, Show Image
        video.style.display = 'none';
        video.classList.add('hidden');
        video.style.opacity = '0';
        video.pause();
        
        img.style.display = 'block';
        img.classList.remove('hidden');
        img.src = config.img;
        img.style.opacity = '1';
        img.style.transform = 'scale(1.05)';
        
        if (logo) logo.classList.remove('logo-loading');
      }
    }

    function setDrinkTemp(temp) {
      if (currentDrinkTemp === temp) return;
      currentDrinkTemp = temp;
      
      const drink = drinks[currentDrinkKey];
      if (!drink || !drink.hasTempToggle) return;
      
      const config = drink[currentDrinkTemp];
      const img = document.getElementById('drink-image');
      const video = document.getElementById('drink-video');
      const desc = document.getElementById('drink-description');
      const ambient = document.getElementById('ambient-grad');
      
      // Update UI Switch buttons immediately (feels highly responsive!)
      updateTempSwitchUI(temp);
      
      // Coordinated slide/fade transitions for details
      desc.style.opacity = '0';
      desc.style.transform = 'translateY(15px)'; // smaller slide offset for quick transition
      const loopLayer = document.getElementById('drink-video-loop');
      if (sdSeqState.active || sdIsSequenceConfig(sdResolveConfig(config))) {
        // Sequence mode: opacity-only cross-fade of both layers
        img.style.opacity = '0';
        video.style.opacity = '0';
        if (loopLayer) loopLayer.style.opacity = '0';
      } else if (config.video) {
        img.style.opacity = '0';
        video.style.opacity = '0.5';
      } else {
        img.style.opacity = '0.5';
        video.style.opacity = '0';
      }
      
      setTimeout(() => {
        // Update text & price
        document.getElementById('drink-title').innerText = config.title;
        document.getElementById('drink-text').innerText = config.text;
        document.getElementById('drink-price').innerText = config.price;
        
        // Update ambient colors
        const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement;
        if (body) {
          body.style.backgroundColor = config.ambient;
        }
        ambient.style.background = `linear-gradient(to right, ${config.ambient} 0%, transparent 100%)`;
        
        // Update media background
        updateMedia(config, img, video);
        
        // Fade in details
        desc.style.opacity = '1';
        desc.style.transform = 'translateY(0)';
        sdScheduleLayout();
      }, 250);
    }

    function showDrink(key, element) {
      currentDrinkKey = key;
      panelManuallyClosed = false; // Reset close state since the selection has changed!
      const drink = drinks[key];
      const img = document.getElementById('drink-image');
      const video = document.getElementById('drink-video');
      const desc = document.getElementById('drink-description');
      const ambient = document.getElementById('ambient-grad');
      const tempSwitch = document.getElementById('drink-temp-switch');
      
      // Update Sidebar Visuals
      document.querySelectorAll('.drink-nav-item').forEach(btn => {
        btn.classList.add('opacity-50');
        btn.querySelector('.nav-line').classList.remove('active-nav-line');
        btn.querySelector('.nav-line').classList.add('inactive-nav-line');
      });
      
      if (element) {
        element.classList.remove('opacity-50');
        element.querySelector('.nav-line').classList.remove('inactive-nav-line');
        element.querySelector('.nav-line').classList.add('active-nav-line');
      }

      // Animate Transition Out
      desc.style.opacity = '0';
      desc.style.transform = 'translateY(30px)';
      const loopLayer = document.getElementById('drink-video-loop');
      const targetCfg = drink && drink.hasTempToggle ? drink.hot : drink;
      if (sdSeqState.active || sdIsSequenceConfig(sdResolveConfig(targetCfg))) {
        // Sequence mode: opacity-only transition (no zoom, it would crop the drink)
        img.style.opacity = '0';
        video.style.opacity = '0';
        if (loopLayer) loopLayer.style.opacity = '0';
      } else {
        img.style.opacity = '0';
        img.style.transform = 'scale(1.1)';
        video.style.opacity = '0';
        video.style.transform = 'scale(1.1)';
      }
      
      setTimeout(() => {
        // Resolve target drink config based on temp toggle
        let config = drink;
        if (drink.hasTempToggle) {
          currentDrinkTemp = 'hot'; // default to hot when selecting a new drink
          config = drink[currentDrinkTemp];
          
          tempSwitch.style.display = 'flex';
          tempSwitch.classList.remove('hidden');
          tempSwitch.classList.add('flex');
          updateTempSwitchUI(currentDrinkTemp);
        } else {
          tempSwitch.style.display = 'none';
          tempSwitch.classList.remove('flex');
          tempSwitch.classList.add('hidden');
        }

        // Update Content
        document.getElementById('drink-title').innerText = config.title;
        document.getElementById('drink-text').innerText = config.text;
        document.getElementById('drink-price').innerText = config.price;
        
        // Update Ambient Colors
        const body = document.getElementById('body-bg') || document.querySelector('.signature-drinks-showcase') || document.documentElement;
        if (body) {
          body.style.backgroundColor = config.ambient;
        }
        ambient.style.background = `linear-gradient(to right, ${config.ambient} 0%, transparent 100%)`;
        
        // Update media background
        updateMedia(config, img, video);
        
        // Reveal panel when selecting new drink
        desc.style.display = 'flex';
        desc.classList.remove('panel-hidden');
        desc.style.opacity = '1';
        desc.style.transform = 'translateY(0)';
        sdScheduleLayout();
      }, 400);
      
      // Close sidebar drawer automatically on mobile when a drink is selected
      if (window.innerWidth < 768) {
        document.body.classList.remove('sidebar-open');
      }
    }

    function hidePanel() {
      const panel = document.getElementById('drink-description');
      panel.style.display = 'none';
      panel.classList.add('panel-hidden');
      panel.style.opacity = '';
      panel.style.transform = '';
      panelManuallyClosed = true; // Lock in the closed state until selection changes
      sdScheduleLayout();
    }

    function revealPanel() {
      if (panelManuallyClosed) return; // Stay hidden if the close button was explicitly clicked
      const panel = document.getElementById('drink-description');
      if (panel.classList.contains('panel-hidden') || panel.style.display === 'none') {
        panel.style.display = 'flex';
        panel.classList.remove('panel-hidden');
        panel.style.opacity = '1';
        panel.style.transform = 'translateY(0)';
        sdScheduleLayout();
      }
    }

    // Toggles the mobile collection menu drawer
    function toggleMobileMenu(event) {
      if (event) event.stopPropagation();
      const isOpen = document.body.classList.toggle('sidebar-open');
      if (isOpen && window.innerWidth < 768) {
        hidePanel();
      }
      sdScheduleLayout();
    }

    // Handles clicks on the immersive background
    function handleBackgroundClick(event) {
      // Close sidebar if clicking outside on mobile
      if (document.body.classList.contains('sidebar-open')) {
        document.body.classList.remove('sidebar-open');
        return;
      }
      
      revealPanel();
    }

    function navigateDrink(direction) {
      const drinkKeys = Object.keys(drinks);
      const currentIndex = drinkKeys.indexOf(currentDrinkKey);
      if (currentIndex === -1) return;
      
      let nextIndex = currentIndex + direction;
      if (nextIndex >= drinkKeys.length) {
        nextIndex = 0;
      } else if (nextIndex < 0) {
        nextIndex = drinkKeys.length - 1;
      }
      
      const nextKey = drinkKeys[nextIndex];
      
      // Find the corresponding navigation button using stored data attribute
      const nextButton = Array.from(document.querySelectorAll('.drink-nav-item')).find(btn => {
        return btn.getAttribute('data-drink-key') === nextKey;
      });
      
      if (nextButton) {
        // Automatically make sure the next drink's category is expanded
        const categoryGroup = nextButton.closest('.category-group');
        if (categoryGroup && !categoryGroup.classList.contains('category-open')) {
          // Close all other categories to keep sidebar clean on narrow viewports
          document.querySelectorAll('.category-group').forEach(group => {
            if (group !== categoryGroup && group.classList.contains('category-open')) {
              group.classList.remove('category-open');
              const content = group.querySelector('.category-content');
              if (content) content.style.maxHeight = '0px';
            }
          });
          // Open target category
          categoryGroup.classList.add('category-open');
          const content = categoryGroup.querySelector('.category-content');
          if (content) {
            content.style.maxHeight = content.scrollHeight + 'px';
          }
        }
        
        showDrink(nextKey, nextButton);
      }
    }


    // Initialize with robust SPA-ready mount handlers and bind dynamic event listeners to bypass strict Content Security Policies (CSP)
    function initDrinksShowcase() {
      // 1. Dynamic event binding for drink navigation items
      document.querySelectorAll('.drink-nav-item').forEach(btn => {
        const key = btn.getAttribute('data-drink-key');
        if (key) {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            showDrink(key, btn);
          });
          btn.removeAttribute('onclick');
        }
      });

      // 2. Dynamic event binding for category toggles
      document.querySelectorAll('.category-group').forEach(group => {
        const groupId = group.id;
        const headerButton = group.querySelector('button');
        if (headerButton) {
          headerButton.addEventListener('click', (e) => {
            e.preventDefault();
            toggleCategory(groupId);
          });
          headerButton.removeAttribute('onclick');
        }
        group.addEventListener('mouseenter', () => {
          hoverCategory(groupId);
        });
        group.removeAttribute('onmouseenter');
      });

      // 3. Mobile menu toggle and drawer close buttons
      const mobileToggle = document.getElementById('mobile-menu-toggle');
      if (mobileToggle) {
        mobileToggle.addEventListener('click', (e) => {
          toggleMobileMenu(e);
        });
        mobileToggle.removeAttribute('onclick');
      }
      const mobileClose = document.getElementById('mobile-menu-close');
      if (mobileClose) {
        mobileClose.addEventListener('click', (e) => {
          toggleMobileMenu(e);
        });
        mobileClose.removeAttribute('onclick');
      }

      // 4. Panel close button
      const panelClose = document.getElementById('panel-close-btn');
      if (panelClose) {
        panelClose.addEventListener('click', (e) => {
          e.preventDefault();
          hidePanel();
        });
        panelClose.removeAttribute('onclick');
      }

      // 5. Navigate drinks (previous / next)
      const prevBtn = document.getElementById('btn-prev-drink');
      if (prevBtn) {
        prevBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          navigateDrink(-1);
        });
        prevBtn.removeAttribute('onclick');
      }
      const nextBtn = document.getElementById('btn-next-drink');
      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          navigateDrink(1);
        });
        nextBtn.removeAttribute('onclick');
      }

      // 6. Temperature switch buttons
      const btnTempHot = document.getElementById('btn-temp-hot');
      if (btnTempHot) {
        btnTempHot.addEventListener('click', (e) => {
          e.preventDefault();
          setDrinkTemp('hot');
        });
        btnTempHot.removeAttribute('onclick');
      }
      const btnTempIced = document.getElementById('btn-temp-iced');
      if (btnTempIced) {
        btnTempIced.addEventListener('click', (e) => {
          e.preventDefault();
          setDrinkTemp('iced');
        });
        btnTempIced.removeAttribute('onclick');
      }

      // 7. Immersive background click
      const mainShowcase = document.querySelector('.drink-reveal-trigger');
      if (mainShowcase) {
        mainShowcase.addEventListener('click', (e) => {
          handleBackgroundClick(e);
        });
        mainShowcase.removeAttribute('onclick');
      }

      // 8. Video loading state events to pulse the brand logo during load times
      const videoEl = document.getElementById('drink-video');
      const logoEl = document.getElementById('brand-logo-container');
      if (videoEl && logoEl) {
        videoEl.addEventListener('loadstart', () => {
          logoEl.classList.add('logo-loading');
        });
        videoEl.addEventListener('playing', () => {
          logoEl.classList.remove('logo-loading');
        });
        videoEl.addEventListener('error', () => {
          logoEl.classList.remove('logo-loading');
        });
      }

      // Open default category on load
      toggleCategory('cat-matcha');

      // 8b. Smart framing recompute for 2-part sequences (guarded: width changes > 2px only,
      // so Square's height poller / mobile URL-bar resizes never cause feedback loops)
      let sdLastWidth = window.innerWidth;
      window.addEventListener('resize', () => {
        if (Math.abs(window.innerWidth - sdLastWidth) > 2) {
          sdLastWidth = window.innerWidth;
          sdScheduleLayout();
        }
      });
      
      // Initialize the default drink show state and play video smoothly on load
      const firstItem = document.querySelector('.drink-nav-item');
      if (firstItem) {
        showDrink('strawberries-cream-matcha', firstItem);
      }

      // 9. Live Sync from Nucleus CRM (Public Read-Only Firestore Document)
      syncDrinksFromNucleusCrm();
    }

    function unwrapFirestoreValue(val) {
      if (!val || typeof val !== 'object') return val;
      if ('stringValue' in val) return val.stringValue;
      if ('booleanValue' in val) return Boolean(val.booleanValue);
      if ('integerValue' in val) return Number(val.integerValue);
      if ('doubleValue' in val) return Number(val.doubleValue);
      if ('nullValue' in val) return null;
      if ('arrayValue' in val) {
        return ((val.arrayValue && val.arrayValue.values) || []).map(unwrapFirestoreValue);
      }
      if ('mapValue' in val) {
        const fields = (val.mapValue && val.mapValue.fields) || {};
        const out = {};
        Object.keys(fields).forEach(k => {
          out[k] = unwrapFirestoreValue(fields[k]);
        });
        return out;
      }
      return val;
    }

    async function syncDrinksFromNucleusCrm() {
      const CRM_FIRESTORE_URL = 'https://firestore.googleapis.com/v1/projects/bizboard-67b4c/databases/(default)/documents/businesses/nYaZ4T5qRKS3Z9EG5mrl/public_data/signature_drinks';
      try {
        const res = await fetch(CRM_FIRESTORE_URL);
        if (!res.ok) return;
        const rawDoc = await res.json();
        if (!rawDoc || !rawDoc.fields) return;

        const data = unwrapFirestoreValue({ mapValue: { fields: rawDoc.fields } });
        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.drinks)) return;

        const visibleCategories = data.categories
          .filter(c => c && c.visible !== false)
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        const visibleDrinks = data.drinks
          .filter(d => d && d.visible !== false)
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        if (!visibleCategories.length || !visibleDrinks.length) return;

        // Rebuild live drinks lookup dictionary in exact submenu + item order
        const prevDrink = drinks[currentDrinkKey];
        const prevCfg = prevDrink ? (prevDrink.hasTempToggle ? (prevDrink[currentDrinkTemp] || prevDrink) : prevDrink) : null;
        const mediaSig = (c) => c ? [c.video || '', c.buildVideo || '', c.loopVideo || '', JSON.stringify(c.framing || null)].join('|') : '';
        const prevMediaSig = mediaSig(prevCfg);
        Object.keys(drinks).forEach(k => delete drinks[k]);

        const navEl = document.querySelector('aside.sidebar-slide nav');
        if (!navEl) return;

        // Preserve the "View Full Menu" footer block inside <nav>
        const footerCta = navEl.querySelector('.pt-4.mb-2');
        navEl.innerHTML = '';

        visibleCategories.forEach((cat, catIdx) => {
          const catDrinks = visibleDrinks.filter(d => d.categoryId === cat.id);
          if (!catDrinks.length) return;

          const groupDiv = document.createElement('div');
          groupDiv.className = 'category-group';
          groupDiv.id = cat.id;

          const headerBtn = document.createElement('button');
          headerBtn.className = 'w-full flex items-center justify-between text-marble-white/50 hover:text-marble-white transition-custom py-2 uppercase tracking-[0.2em] text-xs font-bold';
          headerBtn.innerHTML = `
            <span class="pointer-events-none">${cat.name}</span>
            <span class="material-symbols-outlined text-sm transition-custom category-chevron pointer-events-none">expand_more</span>
          `;
          headerBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleCategory(cat.id);
          });
          groupDiv.addEventListener('mouseenter', () => hoverCategory(cat.id));

          const contentDiv = document.createElement('div');
          contentDiv.className = 'category-content flex flex-col gap-4 pl-2 border-l border-white/5';

          catDrinks.forEach((d) => {
            const key = d.key || d.id;
            drinks[key] = {
              title: d.title,
              text: d.text,
              img: d.img,
              video: d.video,
              buildVideo: typeof d.buildVideo === 'string' ? d.buildVideo : '',
              loopVideo: typeof d.loopVideo === 'string' ? d.loopVideo : '',
              framing: sdNormalizeFraming(d.framing),
              price: d.price,
              ambient: d.ambient || '#1C2E1F',
              hasTempToggle: Boolean(d.hasTempToggle),
              hot: sdNormalizeVariant(d.hot),
              iced: sdNormalizeVariant(d.iced)
            };

            const itemBtn = document.createElement('button');
            const isActive = key === currentDrinkKey;
            itemBtn.className = `drink-nav-item group flex items-center gap-4 text-left transition-custom ${isActive ? '' : 'opacity-50 hover:opacity-100'}`;
            itemBtn.setAttribute('data-drink-key', key);
            itemBtn.innerHTML = `
              <span class="nav-line ${isActive ? 'active-nav-line' : 'inactive-nav-line group-hover:w-10'} h-px transition-custom"></span>
              <span class="text-marble-white text-base tracking-wide font-light transition-custom">${d.title}</span>
            `;
            itemBtn.addEventListener('click', (e) => {
              e.preventDefault();
              showDrink(key, itemBtn);
            });
            contentDiv.appendChild(itemBtn);
          });

          groupDiv.appendChild(headerBtn);
          groupDiv.appendChild(contentDiv);
          navEl.appendChild(groupDiv);

          if (catIdx === 0) {
            groupDiv.classList.add('category-open');
            setTimeout(() => {
              contentDiv.style.maxHeight = contentDiv.scrollHeight + 'px';
            }, 20);
          }
        });

        if (footerCta) {
          navEl.appendChild(footerCta);
        }

        // If the currently displayed drink was hidden in CRM, switch to the first visible drink
        if (!drinks[currentDrinkKey]) {
          const firstKey = Object.keys(drinks)[0];
          const firstBtn = navEl.querySelector('.drink-nav-item');
          if (firstKey && firstBtn) {
            showDrink(firstKey, firstBtn);
          }
        } else {
          // Refresh current drink text & price in case it was edited in Nucleus CRM
          const activeDrink = drinks[currentDrinkKey];
          const activeCfg = activeDrink.hasTempToggle ? (activeDrink[currentDrinkTemp] || activeDrink) : activeDrink;
          if (activeCfg) {
            const titleEl = document.getElementById('drink-title');
            const textEl = document.getElementById('drink-text');
            const priceEl = document.getElementById('drink-price');
            if (titleEl) titleEl.innerText = activeCfg.title;
            if (textEl) textEl.innerText = activeCfg.text;
            if (priceEl) priceEl.innerText = activeCfg.price;
            // Live CRM media changed for the drink on screen (e.g. a new build/loop sequence): restart its media
            if (mediaSig(activeCfg) !== prevMediaSig && (activeCfg.video || activeCfg.img || sdIsSequenceConfig(activeCfg))) {
              updateMedia(activeCfg, document.getElementById('drink-image'), document.getElementById('drink-video'));
            }
          }
        }
      } catch (err) {
        console.warn('Nucleus CRM live sync skipped (using compiled fallback):', err);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initDrinksShowcase();
    } else {
      document.addEventListener('DOMContentLoaded', initDrinksShowcase);
    }
  </script>
